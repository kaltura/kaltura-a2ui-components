version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # zod and @a2ui/* are peer dependencies (ADR 0003): bump them by hand with
    # the peer ranges. @types/node follows .nvmrc.
    ignore:
      - dependency-name: '@a2ui/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
