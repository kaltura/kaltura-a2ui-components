name: release

# Tag push (v*) -> checks -> build -> npm publish (provenance) -> jsDelivr check -> GitHub Release.
# Tags never move and dist/ is never committed. See docs/release.md.
#
# Repository variable NPM_PUBLISH must be 'true' to publish. Otherwise npm publish
# and the CDN check are skipped and the GitHub Release is always a prerelease,
# never Latest, and says it is not on npm or a CDN (docs/release.md).
#
# Dry run: run this workflow by hand from a tag (Use workflow from: the tag) with
# dry_run left on. It checks and builds and uploads the artifact. It never publishes
# and never creates a Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check and build only. No npm publish, no Release.'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      npm_tag: ${{ steps.check.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag commit must be an ancestor of origin/main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag commit is not on main. Merge it to main first, then tag."; exit 1; }
      - name: dist/ must not be tracked
        run: test -z "$(git ls-files dist)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - name: Tag must match package.json
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs "$TAG" >> "$GITHUB_OUTPUT"

  ci:
    name: ci
    needs: verify-tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  e2e:
    name: e2e
    needs: verify-tag
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml

  build:
    name: build and stamp
    needs: [verify-tag, ci, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      npm_publish: ${{ steps.mode.outputs.npm_publish }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache here: this job makes the bytes that get published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run size
      - name: Choose CDN path
        id: mode
        env:
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mode=gh
          publish=false
          if [ "$NPM_PUBLISH" = 'true' ]; then
            mode=npm
            publish=true
          else
            echo '::warning::NPM_PUBLISH is not true. Not publishing to npm. The Release will be a prerelease and will say it is not on npm or a CDN.'
          fi
          dry_run=false
          if [ "$DRY_RUN" = 'true' ]; then
            echo '::warning::Dry run. Nothing is published and no Release is created.'
            dry_run=true
            publish=false
          fi
          {
            echo "mode=$mode"
            echo "npm_publish=$publish"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
      # Edits the catalog in this workspace only. Nothing is committed or pushed.
      - name: Stamp catalog (tag and SRI)
        env:
          TAG: ${{ github.ref_name }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: node scripts/stamp-catalog.mjs --mode "$MODE" --tag "$TAG"
      # A plain script, not a test filter: it cannot pass by running nothing.
      - name: Check the stamped catalog
        env:
          TAG: ${{ github.ref_name }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: node scripts/release-verify-stamp.mjs --mode "$MODE" --tag "$TAG"
      - name: Pack, SBOM and hashes
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/release"
          mkdir -p "$out"
          npm pack --ignore-scripts --pack-destination "$out"
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > "$out/sbom.cdx.json"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - dist | gzip -n > "$out/dist.tar.gz"
          cp src/catalog/kaltura_catalog.json "$out/kaltura_catalog.json"
          node scripts/release-hashes.mjs --version "$VERSION" --out "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30

  publish:
    name: npm publish
    needs: [verify-tag, build]
    if: ${{ needs.build.outputs.npm_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Add required reviewers to this environment. Also set it on the npm trusted publisher.
    environment: release
    permissions:
      id-token: write # npm trusted publishing (OIDC) and provenance. No other job has it.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      # Keep in sync with .nvmrc (test/release/workflows.test.ts checks it). No checkout in this job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
      - name: Publish the built tarball
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
          NPM_TAG: ${{ needs.verify-tag.outputs.npm_tag }}
        run: |
          set -euo pipefail
          # Trusted publishing needs npm 11.5.1 or newer.
          npm_version="$(npm --version)"
          [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n1)" = '11.5.1' ] \
            || { echo "::error::npm ${npm_version} is too old for trusted publishing (needs 11.5.1)"; exit 1; }
          cd "${RUNNER_TEMP}/release"
          sha256sum --check SHA256SUMS
          tarball="$(ls ./*.tgz)"
          tar -xOzf "$tarball" package/package.json | jq -e --arg v "$VERSION" '.name == "@kaltura/a2ui-react" and .version == $v' > /dev/null
          if npm view "@kaltura/a2ui-react@${VERSION}" version > /dev/null 2>&1; then
            echo "::warning::@kaltura/a2ui-react@${VERSION} is already on npm. Skipping publish. The CDN check decides if it matches."
          else
            npm publish "$tarball" --access public --provenance --tag "$NPM_TAG"
          fi

  verify-cdn:
    name: jsDelivr matches the build
    needs: [verify-tag, build, publish]
    if: ${{ needs.build.outputs.npm_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      # jsDelivr caches a 404 on the npm path for 10 minutes: 20 tries, 60 s apart.
      - name: Compare registry and CDN bytes with the build
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: node scripts/verify-cdn.mjs --version "$VERSION" --hashes "${RUNNER_TEMP}/release/hashes.json" --attempts 20 --delay-ms 60000

  release:
    name: GitHub Release
    needs: [verify-tag, build, publish, verify-cdn]
    # publish and verify-cdn are skipped (not failed) when NPM_PUBLISH is not true or on a dry run.
    if: ${{ !cancelled() && !failure() && needs.build.result == 'success' && needs.build.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the Release and upload assets. Nothing else in this workflow can.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          NPM_TAG: ${{ needs.verify-tag.outputs.npm_tag }}
          NPM_PUBLISHED: ${{ needs.build.outputs.npm_publish }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/release"
          {
            echo "Version ${VERSION} from commit ${GITHUB_SHA}."
            echo
            if [ "$NPM_PUBLISHED" = 'true' ]; then
              echo "npm: \`@kaltura/a2ui-react@${VERSION}\` (published with provenance). CDN: \`https://cdn.jsdelivr.net/npm/@kaltura/a2ui-react@${VERSION}/dist/\`."
            else
              echo "**Prerelease. This version is not on npm and not on a CDN.** The assets below are the build output only. The catalog URLs inside them do not resolve."
            fi
            echo
            echo "### Integrity"
            jq -r '.cdn | to_entries[] | "- `\(.key)`: `\(.value)`"' "$out/hashes.json"
            echo "- npm tarball: \`$(jq -r '.tarball.integrity' "$out/hashes.json")\`"
            echo
            echo "\`SHA256SUMS\` lists every asset. \`sbom.cdx.json\` is a CycloneDX SBOM of the runtime dependencies."
          } > "${RUNNER_TEMP}/notes.md"
          # Without npm this is never a real release: always a prerelease, never Latest.
          if [ "$NPM_PUBLISHED" = 'true' ] && [ "$NPM_TAG" = 'latest' ]; then
            flags=()
          else
            flags=(--prerelease --latest=false)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$out"/* --clobber --repo "$GITHUB_REPOSITORY"
            [ "${#flags[@]}" -eq 0 ] || gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          else
            gh release create "$TAG" "$out"/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes-file "${RUNNER_TEMP}/notes.md" --generate-notes "${flags[@]}"
          fi
