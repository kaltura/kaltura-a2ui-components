<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>a2ui e2e harness</title>
<main id="host"></main>
<script>
  window.__pwned = [];
  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push(e.message));
  window.addEventListener('unhandledrejection', (e) => window.__errors.push(String(e.reason)));
  window.__mount = (tag, config) => {
    const el = document.createElement(tag);
    el.config = config;
    document.getElementById('host').appendChild(el);
    return el;
  };
  // The IIFE bundle reads bare process.env.NODE_ENV. ?noshim shows the raw failure (E2E-01).
  if (!new URLSearchParams(location.search).has('noshim')) {
    window.process = { env: { NODE_ENV: 'development' } };
  }
</script>
<script src="/dist/kaltura-wc.js"></script>
