<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>player stub</title>
<!-- Stands in for the Kaltura player page in e2e/player-sandbox.spec.ts. Each control records its result on <body>. -->
<button id="fs" type="button">fullscreen</button>
<a id="dl" download="clip.txt">download</a>
<a id="top" href="__ESCAPE_URL__" target="_top">leave</a>
<script>
  const body = document.body;
  body.dataset.ran = '1';
  body.dataset.origin = location.origin;
  document.getElementById('dl').href = URL.createObjectURL(new Blob(['clip'], { type: 'text/plain' }));
  document.getElementById('fs').addEventListener('click', () => {
    document.documentElement.requestFullscreen().then(
      () => (body.dataset.fullscreen = 'ok'),
      (e) => (body.dataset.fullscreen = `denied ${e.name}`),
    );
  });
</script>
